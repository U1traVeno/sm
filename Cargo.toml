[package]
name = "sm-skill-manager"
version = "0.3.2"
edition = "2024"
rust-version = "1.88"
description = "A Unix-style profile and visibility manager for agent skills"
license = "MIT"
repository = "https://github.com/U1traVeno/sm"
readme = "README.md"
keywords = ["agent-skills", "cli", "profiles", "symlink"]
categories = ["command-line-utilities", "development-tools"]
exclude = ["/.github", "/docs/.vitepress", "/package.json", "/package-lock.json"]

[[bin]]
name = "sm"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
blake3 = "1.8"
clap = { version = "4.5", features = ["derive"] }
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
toml_edit = "0.22"

[dev-dependencies]
tempfile = "3.15"
