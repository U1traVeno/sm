name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish or recover
        required: true
        type: string

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Verify tag matches package version
        run: |
          set -euo pipefail
          case "$RELEASE_TAG" in
            v*) version="${RELEASE_TAG#v}" ;;
            *) echo "release tag must start with v: $RELEASE_TAG" >&2; exit 1 ;;
          esac
          metadata=$(cargo metadata --no-deps --format-version 1)
          package_name=$(jq -r '.packages[0].name' <<<"$metadata")
          package_version=$(jq -r '.packages[0].version' <<<"$metadata")
          test "$package_name" = "sm-skill-manager"
          test "$version" = "$package_version"
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-features
      - run: cargo package --locked
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run docs:build

  crates-io:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish crate if needed
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          if cargo info --registry crates-io "sm-skill-manager@$version" >/dev/null 2>&1; then
            echo "sm-skill-manager $version is already published"
          else
            test -n "$CARGO_REGISTRY_TOKEN"
            cargo publish --locked
          fi
